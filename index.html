<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>5x5 Lifts</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />

  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="5x5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>

  <!-- Bottom nav (shown on every screen) -->
  <nav id="tabbar" class="tabbar">
    <button data-tab="workout" class="tab active">Workout</button>
    <button data-tab="calendar" class="tab">Calendar</button>
    <button data-tab="history" class="tab">History</button>
    <button data-tab="settings" class="tab">Settings</button>
  </nav>

  <!-- Hidden audio for rest-timer cue -->
  <audio id="cue" preload="auto">
    <!-- Short beep encoded as a data URI is generated at runtime; element is here as a fallback. -->
  </audio>

  <script src="app.js"></script>
</body>
</html>
